services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: curry
      POSTGRES_USER: curry
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
    volumes:
      - curry_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U curry -d curry"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/curry
      DB_USER: curry
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
      SERVER_ADDRESS: 0.0.0.0
      # O proxy do Codespaces reescreve Origin para https://localhost:8080.
      CORS_ORIGINS: "http://localhost:4200,http://127.0.0.1:4200${CODESPACE_NAME:+,https://localhost:8080,https://${CODESPACE_NAME}-8080.${GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN:-app.github.dev}}"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  curry_pgdata:
