# Use scripts/iniciar-neon.sh para informar a conexão e a senha antes de iniciar.
# Este arquivo executa somente a aplicação. O PostgreSQL local não é removido.
services:
  app:
    build: .
    environment:
      DB_URL: "${NEON_DB_URL:-}"
      DB_USER: "${NEON_DB_USER:-neondb_owner}"
      DB_PASSWORD: "${NEON_DB_PASSWORD:-}"
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-false}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:4200,http://127.0.0.1:4200}"
    ports:
      - "127.0.0.1:8080:8080"
