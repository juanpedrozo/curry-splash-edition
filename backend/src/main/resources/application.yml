spring:
  application:
    name: curry-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/curry}
    username: ${DB_USER:curry}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
  flyway:
    postgresql:
      transactional-lock: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    deserialization:
      accept-float-as-int: false
      fail-on-numbers-for-enums: true
      accept-empty-string-as-null-object: false

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

curry:
  cors-origins: ${CORS_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
